services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATABASE_PATH: /data/kanban.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - kanban-data:/data
    restart: unless-stopped

volumes:
  kanban-data:
